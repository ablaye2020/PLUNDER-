<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLUNDERER · Signal Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0b0b0b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        /* ANIMATED BACKGROUND PARTICLES + GLOW */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: radial-gradient(circle at 20% 30%, #1a0505, #000000 70%);
        }

        .glow-ring {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: floatGlow 18s infinite alternate ease-in-out;
        }

        .glow-ring:nth-child(1) {
            width: 600px;
            height: 600px;
            background: #ff0040;
            top: -10%;
            left: -10%;
            animation-duration: 22s;
        }

        .glow-ring:nth-child(2) {
            width: 500px;
            height: 500px;
            background: #ff3300;
            bottom: -15%;
            right: -10%;
            animation-duration: 26s;
            animation-delay: -4s;
        }

        .glow-ring:nth-child(3) {
            width: 400px;
            height: 400px;
            background: #aa00ff;
            top: 40%;
            left: 60%;
            animation-duration: 20s;
            animation-delay: -8s;
            opacity: 0.15;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(60px, -40px) scale(1.1) rotate(5deg); }
            66% { transform: translate(-30px, 50px) scale(0.9) rotate(-3deg); }
            100% { transform: translate(40px, -20px) scale(1.05) rotate(4deg); }
        }

        /* Floating particles (matrix style) */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #ff3333;
            box-shadow: 0 0 6px #ff0000, 0 0 12px #ff000066;
            border-radius: 50%;
            opacity: 0.3;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
        }

        /* moving grid lines (enhanced) */
        .grid-line-h, .grid-line-v {
            position: fixed;
            background: rgba(255, 40, 40, 0.08);
            z-index: 1;
            pointer-events: none;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.05);
        }

        .grid-line-h {
            height: 1px;
            width: 200%;
            left: -50%;
            animation: slideH 14s linear infinite;
        }

        .grid-line-v {
            width: 1px;
            height: 200%;
            top: -50%;
            animation: slideV 14s linear infinite;
        }

        @keyframes slideH {
            0% { transform: translateX(0); }
            100% { transform: translateX(50%); }
        }

        @keyframes slideV {
            0% { transform: translateY(0); }
            100% { transform: translateY(50%); }
        }

        .grid-line-h:nth-child(4) { top: 12%; animation-duration: 18s; animation-delay: -2s; }
        .grid-line-h:nth-child(5) { top: 28%; animation-duration: 22s; animation-delay: -6s; }
        .grid-line-h:nth-child(6) { top: 44%; animation-duration: 16s; animation-delay: -1s; }
        .grid-line-h:nth-child(7) { top: 60%; animation-duration: 20s; animation-delay: -9s; }
        .grid-line-h:nth-child(8) { top: 76%; animation-duration: 24s; animation-delay: -4s; }
        .grid-line-h:nth-child(9) { top: 92%; animation-duration: 19s; animation-delay: -7s; }

        .grid-line-v:nth-child(10) { left: 10%; animation-duration: 20s; animation-delay: -3s; }
        .grid-line-v:nth-child(11) { left: 25%; animation-duration: 17s; animation-delay: -8s; }
        .grid-line-v:nth-child(12) { left: 40%; animation-duration: 23s; animation-delay: -2s; }
        .grid-line-v:nth-child(13) { left: 55%; animation-duration: 19s; animation-delay: -6s; }
        .grid-line-v:nth-child(14) { left: 70%; animation-duration: 21s; animation-delay: -1s; }
        .grid-line-v:nth-child(15) { left: 85%; animation-duration: 18s; animation-delay: -5s; }

        /* --- overlay access --- */
        #access-overlay {
            position: fixed;
            inset: 0;
            background: #0a0000;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(4px);
        }
        #access-overlay.hidden { display: none; }

        #access-overlay .logo {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 12px;
            color: #fff;
            text-shadow: 0 0 60px rgba(255, 0, 0, 0.9), 0 0 120px rgba(255, 0, 0, 0.4);
            font-family: 'Courier New', monospace;
            text-align: center;
        }
        #access-overlay .logo span { color: #ff0000; }

        #access-overlay .sub {
            color: #ff3333;
            font-size: 14px;
            letter-spacing: 10px;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 30px rgba(255,0,0,0.5);
            margin-bottom: 10px;
        }

        #access-overlay .lock-icon {
            font-size: 48px;
            margin-bottom: 10px;
            opacity: 0.9;
            filter: drop-shadow(0 0 30px rgba(255,0,0,0.6));
        }

        #access-overlay input {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 0, 0, 0.5);
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 22px;
            color: #fff;
            text-align: center;
            width: 240px;
            outline: none;
            letter-spacing: 10px;
            font-family: 'Courier New', monospace;
            transition: 0.3s;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.05);
        }
        #access-overlay input:focus {
            border-color: #ff1a1a;
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.25);
        }
        #access-overlay .btn-access {
            background: #ff0000;
            color: #fff;
            border: none;
            padding: 14px 56px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.5);
        }
        #access-overlay .btn-access:hover {
            transform: scale(1.06);
            box-shadow: 0 0 80px rgba(255, 0, 0, 0.7);
        }
        #access-overlay .error-msg {
            color: #ff6666;
            font-size: 14px;
            min-height: 20px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 20px rgba(255,0,0,0.3);
        }

        /* --- main content --- */
        #main-content {
            display: none;
            position: relative;
            z-index: 10;
            background: rgba(8, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 40, 40, 0.25);
            border-radius: 40px;
            padding: 42px 40px;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 0 100px rgba(255, 0, 0, 0.07), inset 0 0 60px rgba(255, 0, 0, 0.02);
            margin: 20px auto;
        }
        #main-content.visible { display: block; }

        .header-image {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 40, 40, 0.2);
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.05);
        }

        .main-logo {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 12px;
            color: #ffffff;
            text-shadow: 0 0 70px rgba(255, 255, 255, 0.08), 0 0 50px rgba(255, 0, 0, 0.3);
            text-align: center;
            font-family: 'Courier New', monospace;
            margin-bottom: 4px;
        }
        .main-logo span {
            color: #ff1a1a;
            text-shadow: 0 0 80px rgba(255, 0, 0, 0.7);
        }

        .main-sub {
            text-align: center;
            color: #ff4444;
            font-size: 14px;
            letter-spacing: 8px;
            text-transform: uppercase;
            border-bottom: 2px solid rgba(255, 0, 0, 0.12);
            padding-bottom: 18px;
            margin-bottom: 24px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 30px rgba(255,0,0,0.2);
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group label {
            color: #dddddd;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 6px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 20px rgba(255,255,255,0.03);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 18px;
            color: #f0f0f0;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: 0.25s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #ff3333;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.06);
        }
        .form-group select option {
            background: #111;
            color: #eee;
        }
        .form-group textarea {
            min-height: 70px;
            resize: vertical;
        }

        .generated-box {
            background: rgba(255, 0, 0, 0.04);
            border: 2px solid rgba(255, 0, 0, 0.12);
            border-radius: 20px;
            padding: 18px 20px;
            margin: 18px 0 22px;
            text-align: left;
            display: none;
            max-height: 400px;
            overflow-y: auto;
            min-height: 60px;
            box-shadow: inset 0 0 40px rgba(255, 0, 0, 0.02);
        }
        .generated-box.visible { display: block; }
        .generated-box .msg-title {
            color: #ff5555;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 20px rgba(255,0,0,0.2);
        }
        .generated-box .msg-content {
            color: #eeeeee;
            font-size: 15px;
            line-height: 2.0;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 20px rgba(255,255,255,0.03);
        }
        .generated-box .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 18px;
            background: #ff3333;
            animation: blink 0.7s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 14px 36px;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
            letter-spacing: 1px;
            flex: 1 1 auto;
            min-width: 140px;
            font-family: 'Courier New', monospace;
        }
        .btn-generate {
            background: #ff1a1a;
            color: #fff;
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.25);
        }
        .btn-generate:hover {
            background: #cc0000;
            transform: scale(1.03);
            box-shadow: 0 0 80px rgba(255, 0, 0, 0.4);
        }
        .btn-generate:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-copy {
            background: rgba(255, 255, 255, 0.06);
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .btn-copy:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            box-shadow: 0 0 50px rgba(37, 211, 102, 0.15);
        }
        .btn-whatsapp:hover {
            background: #1da851;
            transform: scale(1.03);
        }
        .btn-whatsapp:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            border: 1px solid rgba(255, 0, 0, 0.25);
            padding: 12px 28px;
            border-radius: 40px;
            color: #ddd;
            font-size: 14px;
            z-index: 1002;
            opacity: 0;
            transition: 0.4s;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            backdrop-filter: blur(10px);
            background: rgba(10, 0, 0, 0.8);
        }
        .toast.show { opacity: 1; }

        .status-text {
            color: #888;
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
            min-height: 20px;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 2px solid rgba(255, 0, 0, 0.08);
            font-family: 'Courier New', monospace;
        }
        .footer-link a {
            color: #ff5555;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 3px;
            transition: 0.3s;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.1);
        }
        .footer-link a:hover {
            color: #ff0000;
            text-shadow: 0 0 60px rgba(255, 0, 0, 0.3);
        }

        .whatsapp-note {
            text-align: center;
            color: #555;
            font-size: 11px;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            #main-content { padding: 28px 18px; margin: 10px; }
            .main-logo { font-size: 34px; letter-spacing: 6px; }
            #access-overlay .logo { font-size: 34px; letter-spacing: 8px; }
            #access-overlay input { width: 200px; font-size: 18px; }
            .header-image { max-height: 160px; }
        }
    </style>
</head>
<body>

    <!-- === ANIMATED BACKGROUND === -->
    <div class="bg-canvas">
        <div class="glow-ring"></div>
        <div class="glow-ring"></div>
        <div class="glow-ring"></div>
        <!-- particles generated by JS -->
        <div id="particle-container"></div>
    </div>

    <!-- === GRID LINES === -->
    <div class="grid-line-h"></div>
    <div class="grid-line-h"></div>
    <div class="grid-line-h"></div>
    <div class="grid-line-h"></div>
    <div class="grid-line-h"></div>
    <div class="grid-line-h"></div>

    <div class="grid-line-v"></div>
    <div class="grid-line-v"></div>
    <div class="grid-line-v"></div>
    <div class="grid-line-v"></div>
    <div class="grid-line-v"></div>
    <div class="grid-line-v"></div>

    <!-- === ACCESS OVERLAY === -->
    <div id="access-overlay">
        <div class="lock-icon">⛔</div>
        <div class="logo">P<span>L</span>UNDERER</div>
        <div class="sub">Access Restricted</div>
        <input type="password" id="access-input" placeholder="••••" maxlength="4" autofocus>
        <button class="btn-access" onclick="checkAccess()">ENTER</button>
        <div class="error-msg" id="access-error"></div>
    </div>

    <!-- === TOAST === -->
    <div class="toast" id="toast"></div>

    <!-- === MAIN CONTENT === -->
    <div id="main-content">
        <img class="header-image" id="header-image" src="" alt="PLUNDERER" onerror="this.style.display='none'">

        <div class="main-logo">P<span>L</span>UNDERER</div>
        <div class="main-sub">⚡ Signal Generator ⚡</div>

        <div class="form-group">
            <label>👤 Name / Username of the abuser</label>
            <input type="text" id="nom" placeholder="Ex: John DOE or @username">
        </div>

        <div class="form-group">
            <label>📱 Their WhatsApp number</label>
            <input type="text" id="numero" placeholder="+221 70 820 15 85">
        </div>

        <div class="form-group">
            <label>⚠️ Type of violation</label>
            <select id="type">
                <option value="harassment">Harassment / Bullying</option>
                <option value="scam">Scam / Fraud</option>
                <option value="identity">Identity Theft</option>
                <option value="illegal">Illegal Content</option>
                <option value="threats">Threats / Violence</option>
                <option value="impersonation">Impersonation</option>
                <option value="doxxing">Doxxing / Private info leaked</option>
                <option value="other">Other (serious)</option>
            </select>
        </div>

        <div class="form-group">
            <label>📝 What happened ? (be honest)</label>
            <textarea id="details" placeholder="Describe exactly what this person did to you..."></textarea>
        </div>

        <div class="generated-box" id="generated-box">
            <div class="msg-title">📨 GENERATING MESSAGE...</div>
            <div class="msg-content" id="message-output">
                <span class="cursor-blink"></span>
            </div>
        </div>

        <div class="status-text" id="status-text">Fill the form and click GENERATE</div>

        <div class="btn-group">
            <button class="btn btn-generate" id="btn-generate" onclick="startGeneration()">⚡ GENERATE</button>
            <button class="btn btn-copy" id="btn-copy" disabled onclick="copyMessage()">📋 COPY</button>
            <button class="btn btn-whatsapp" id="btn-wa" disabled onclick="sendWhatsApp()">💬 WHATSAPP</button>
        </div>

        <div class="whatsapp-note">📌 Message copied automatically — then paste in WhatsApp Support chat</div>

        <div class="footer-link">
            <a href="https://ablaye2020.github.io" target="_blank">ablaye2020.github.io</a>
        </div>
    </div>

    <script>
        // === BACKGROUND PARTICLES ===
        (function createParticles() {
            const container = document.getElementById('particle-container');
            const count = 60;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = 1.5 + Math.random() * 3;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDuration = 12 + Math.random() * 25 + 's';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.opacity = 0.2 + Math.random() * 0.4;
                const hue = 340 + Math.random() * 20;
                particle.style.background = `hsl(${hue}, 90%, 55%)`;
                particle.style.boxShadow = `0 0 12px hsl(${hue}, 90%, 55%)`;
                container.appendChild(particle);
            }
        })();

        // === IMAGE ===
        const imageUrl = "064CCB30-6A16-479A-B239-CB3DE24E4DE3.jpeg";
        document.addEventListener('DOMContentLoaded', () => {
            const img = document.getElementById('header-image');
            img.src = imageUrl;
            img.alt = "PLUNDERER";
        });

        // === ACCESS ===
        const ACCESS_CODE = '0011';

        function checkAccess() {
            const input = document.getElementById('access-input');
            const error = document.getElementById('access-error');
            if (input.value === ACCESS_CODE) {
                document.getElementById('access-overlay').classList.add('hidden');
                document.getElementById('main-content').classList.add('visible');
                error.textContent = '';
            } else {
                error.textContent = '❌ Incorrect code';
                input.value = '';
                input.focus();
            }
        }

        document.getElementById('access-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAccess();
        });

        // === GENERATOR LOGIC ===
        let isGenerating = false;
        let displayText = '';

        function generateFullMessage() {
            const nom = document.getElementById('nom').value.trim();
            const numero = document.getElementById('numero').value.trim();
            const type = document.getElementById('type').value;
            const details = document.getElementById('details').value.trim();

            const typeLabels = {
                harassment: "HARASSMENT & BULLYING",
                scam: "FRAUD / SCAM",
                identity: "IDENTITY THEFT",
                illegal: "ILLEGAL CONTENT",
                threats: "THREATS & VIOLENCE",
                impersonation: "IMPERSONATION",
                doxxing: "DOXXING / PRIVATE INFO LEAKED",
                other: "SERIOUS VIOLATION"
            };

            let msg = '';
            msg += `🚨 URGENT EMERGENCY REPORT - ${typeLabels[type] || 'SERIOUS VIOLATION'}\n\n`;
            msg += `I am filing an OFFICIAL COMPLAINT against a WhatsApp user who is DANGEROUS and is violating your Terms of Service.\n\n`;

            if (nom) msg += `🔴 ABUSER: ${nom}\n`;
            if (numero) msg += `📱 NUMBER: ${numero}\n\n`;

            msg += `📌 WHAT HAPPENED:\n${details || 'This person is engaging in serious criminal behavior on your platform.'}\n\n`;

            msg += `⚠️ THIS IS NOT A MINOR ISSUE — THIS IS A SAFETY EMERGENCY.\n\n`;
            msg += `I DEMAND:\n`;
            msg += `→ IMMEDIATE BAN of this account\n`;
            msg += `→ FULL INVESTIGATION\n`;
            msg += `→ PRESERVATION OF CHAT LOGS (for legal action)\n\n`;

            msg += `I am prepared to take LEGAL ACTION if WhatsApp does not act immediately.\n`;
            msg += `This person is DANGEROUS and needs to be removed from the platform NOW.\n\n`;

            msg += `I have screenshots, chat logs, and evidence ready for law enforcement.\n`;
            msg += `I will file a police report TODAY if this is not resolved.\n\n`;

            msg += `RESPOND TO THIS MESSAGE WITH CONFIRMATION OF ACTION TAKEN.\n`;
            msg += `I need a REAL HUMAN to handle this — not an automated response.\n\n`;

            msg += `My safety depends on your immediate action.`;

            return msg;
        }

        function startGeneration() {
            if (isGenerating) return;

            const output = document.getElementById('message-output');
            const box = document.getElementById('generated-box');
            const btnGen = document.getElementById('btn-generate');
            const btnCopy = document.getElementById('btn-copy');
            const btnWa = document.getElementById('btn-wa');
            const status = document.getElementById('status-text');

            isGenerating = true;
            btnGen.disabled = true;
            btnCopy.disabled = true;
            btnWa.disabled = true;
            status.textContent = '⏳ Generating...';
            output.textContent = '';
            box.classList.add('visible');

            const fullMessage = generateFullMessage();
            const chars = fullMessage.split('');
            let index = 0;
            displayText = '';

            function typeNextChar() {
                if (index < chars.length) {
                    displayText += chars[index];
                    output.textContent = displayText;
                    index++;
                    const delay = chars[index - 1] === '\n' ? 40 : 10 + Math.random() * 20;
                    setTimeout(typeNextChar, delay);
                } else {
                    isGenerating = false;
                    btnGen.disabled = false;
                    btnCopy.disabled = false;
                    btnWa.disabled = false;
                    status.textContent = '✅ Message ready — STRONG & URGENT';
                    showToast('✅ Powerful message generated');
                }
            }

            setTimeout(typeNextChar, 200);
        }

        function copyMessage() {
            const text = document.getElementById('message-output').textContent;
            if (!text) return showToast('❌ Generate a message first');
            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 Copied to clipboard');
            }).catch(() => {
                const area = document.createElement('textarea');
                area.value = text;
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                area.remove();
                showToast('📋 Copied');
            });
        }

        function sendWhatsApp() {
            const text = document.getElementById('message-output').textContent;
            if (!text) return showToast('❌ Generate a message first');

            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 Message copied! Opening WhatsApp...');
            }).catch(() => {
                const area = document.createElement('textarea');
                area.value = text;
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                area.remove();
                showToast('📋 Message copied! Opening WhatsApp...');
            });

            setTimeout(() => {
                window.open('https://wa.me/', '_blank');
            }, 500);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('generated-box').classList.remove('visible');
            document.getElementById('message-output').textContent = '';
            document.getElementById('status-text').textContent = 'Fill the form and click GENERATE';
        });
    </script>

</body>
</html>
