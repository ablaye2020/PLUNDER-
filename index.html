<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLUNDERER · Signal Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* === POINTS ROUGES - TRÈS VISIBLES === */
        .dot {
            position: fixed;
            width: 6px;
            height: 6px;
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 0, 0, 1), 0 0 60px rgba(255, 0, 0, 0.8), 0 0 100px rgba(255, 0, 0, 0.4);
            z-index: 999;
            pointer-events: none;
            animation: floatDot 7s linear infinite;
        }

        @keyframes floatDot {
            0% { transform: translate(0, 0) scale(1); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* === LIGNES ROUGES - TRÈS VISIBLES === */
        .line-h, .line-v {
            position: fixed;
            background: #ff0000;
            box-shadow: 0 0 40px rgba(255, 0, 0, 1), 0 0 80px rgba(255, 0, 0, 0.6);
            z-index: 999;
            pointer-events: none;
        }
        .line-h {
            height: 3px;
            animation: slideH 2.8s linear infinite;
        }
        .line-v {
            width: 3px;
            animation: slideV 2.8s linear infinite;
        }

        @keyframes slideH {
            0% { left: -10%; }
            100% { left: 110%; }
        }
        @keyframes slideV {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        .line-h:nth-child(1) { top: 8%; animation-duration: 2.0s; }
        .line-h:nth-child(2) { top: 20%; animation-duration: 2.8s; animation-delay: 0.4s; }
        .line-h:nth-child(3) { top: 32%; animation-duration: 2.4s; animation-delay: 0.9s; }
        .line-h:nth-child(4) { top: 44%; animation-duration: 3.2s; animation-delay: 0.2s; }
        .line-h:nth-child(5) { top: 56%; animation-duration: 2.6s; animation-delay: 1.1s; }
        .line-h:nth-child(6) { top: 68%; animation-duration: 3.0s; animation-delay: 0.6s; }
        .line-h:nth-child(7) { top: 80%; animation-duration: 2.2s; animation-delay: 0.8s; }
        .line-h:nth-child(8) { top: 92%; animation-duration: 3.4s; animation-delay: 0.3s; }

        .line-v:nth-child(9) { left: 6%; animation-duration: 2.2s; }
        .line-v:nth-child(10) { left: 16%; animation-duration: 3.0s; animation-delay: 0.5s; }
        .line-v:nth-child(11) { left: 26%; animation-duration: 2.6s; animation-delay: 1.0s; }
        .line-v:nth-child(12) { left: 36%; animation-duration: 3.4s; animation-delay: 0.3s; }
        .line-v:nth-child(13) { left: 46%; animation-duration: 2.4s; animation-delay: 0.8s; }
        .line-v:nth-child(14) { left: 56%; animation-duration: 3.2s; animation-delay: 1.3s; }
        .line-v:nth-child(15) { left: 66%; animation-duration: 2.8s; animation-delay: 0.1s; }
        .line-v:nth-child(16) { left: 76%; animation-duration: 3.6s; animation-delay: 0.7s; }
        .line-v:nth-child(17) { left: 86%; animation-duration: 2.0s; animation-delay: 0.9s; }
        .line-v:nth-child(18) { left: 94%; animation-duration: 3.8s; animation-delay: 0.4s; }

        /* === ACCESS OVERLAY === */
        #access-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 1001;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }
        #access-overlay.hidden { display: none; }

        #access-overlay .logo {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 12px;
            color: #fff;
            text-shadow: 0 0 50px rgba(255, 0, 0, 0.8), 0 0 100px rgba(255, 0, 0, 0.4);
            font-family: 'Courier New', monospace;
            text-align: center;
        }
        #access-overlay .logo span { color: #ff0000; }

        #access-overlay .sub {
            color: #ff0000;
            font-size: 14px;
            letter-spacing: 8px;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 30px rgba(255,0,0,0.5);
            margin-bottom: 10px;
        }

        #access-overlay .lock-icon {
            font-size: 48px;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        #access-overlay input {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 0, 0, 0.5);
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 22px;
            color: #fff;
            text-align: center;
            width: 240px;
            outline: none;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
            transition: 0.3s;
        }
        #access-overlay input:focus {
            border-color: #ff0000;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.3);
        }
        #access-overlay .btn-access {
            background: #ff0000;
            color: #fff;
            border: none;
            padding: 14px 56px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.4);
        }
        #access-overlay .btn-access:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.6);
        }
        #access-overlay .error-msg {
            color: #ff4444;
            font-size: 14px;
            min-height: 20px;
            font-family: 'Courier New', monospace;
        }

        /* === MAIN CONTENT === */
        #main-content {
            display: none;
            position: relative;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid rgba(255, 0, 0, 0.3);
            border-radius: 32px;
            padding: 42px 40px;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 0 80px rgba(255, 0, 0, 0.1);
        }
        #main-content.visible { display: block; }

        .main-logo {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 10px;
            color: #fff;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.8);
            text-align: center;
            font-family: 'Courier New', monospace;
        }
        .main-logo span { color: #ff0000; }

        .main-sub {
            text-align: center;
            color: #888;
            font-size: 12px;
            letter-spacing: 5px;
            text-transform: uppercase;
            border-bottom: 2px solid rgba(255, 0, 0, 0.2);
            padding-bottom: 20px;
            margin-bottom: 28px;
            font-family: 'Courier New', monospace;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group label {
            color: #aaa;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 6px;
            font-family: 'Courier New', monospace;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: #eee;
            font-size: 15px;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: 0.25s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.1);
        }
        .form-group select option {
            background: #111;
            color: #eee;
        }
        .form-group textarea {
            min-height: 70px;
            resize: vertical;
        }

        .generated-box {
            background: rgba(255, 0, 0, 0.05);
            border: 2px solid rgba(255, 0, 0, 0.2);
            border-radius: 16px;
            padding: 18px 20px;
            margin: 18px 0 22px;
            text-align: left;
            display: none;
            max-height: 350px;
            overflow-y: auto;
            min-height: 60px;
        }
        .generated-box.visible { display: block; }
        .generated-box .msg-title {
            color: #ff4444;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
        }
        .generated-box .msg-content {
            color: #ddd;
            font-size: 14px;
            line-height: 1.9;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Courier New', monospace;
        }
        .generated-box .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 18px;
            background: #ff0000;
            animation: blink 0.7s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 13px 32px;
            border: none;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
            letter-spacing: 0.5px;
            flex: 1 1 auto;
            min-width: 140px;
            font-family: 'Courier New', monospace;
        }
        .btn-generate {
            background: #ff0000;
            color: #fff;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.4);
        }
        .btn-generate:hover {
            background: #cc0000;
            transform: scale(1.03);
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.6);
        }
        .btn-generate:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-copy {
            background: rgba(255, 255, 255, 0.06);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .btn-copy:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            box-shadow: 0 0 30px rgba(37, 211, 102, 0.2);
        }
        .btn-whatsapp:hover {
            background: #1da851;
            transform: scale(1.03);
        }
        .btn-whatsapp:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 12px 28px;
            border-radius: 40px;
            color: #aaa;
            font-size: 14px;
            z-index: 1002;
            opacity: 0;
            transition: 0.4s;
            pointer-events: none;
            font-family: 'Courier New', monospace;
        }
        .toast.show { opacity: 1; }

        .status-text {
            color: #666;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
            min-height: 20px;
        }

        @media (max-width: 600px) {
            #main-content { padding: 28px 18px; }
            .main-logo { font-size: 32px; letter-spacing: 6px; }
            #access-overlay .logo { font-size: 34px; letter-spacing: 8px; }
            #access-overlay input { width: 200px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <!-- === POINTS ROUGES (100 points) === -->
    <div id="dots-container"></div>

    <!-- === LIGNES ROUGES === -->
    <div class="line-h"></div>
    <div class="line-h"></div>
    <div class="line-h"></div>
    <div class="line-h"></div>
    <div class="line-h"></div>
    <div class="line-h"></div>
    <div class="line-h"></div>
    <div class="line-h"></div>
    <div class="line-v"></div>
    <div class="line-v"></div>
    <div class="line-v"></div>
    <div class="line-v"></div>
    <div class="line-v"></div>
    <div class="line-v"></div>
    <div class="line-v"></div>
    <div class="line-v"></div>
    <div class="line-v"></div>
    <div class="line-v"></div>

    <!-- === ACCESS OVERLAY === -->
    <div id="access-overlay">
        <div class="lock-icon">⛔</div>
        <div class="logo">P<span>L</span>UNDERER</div>
        <div class="sub">Access Restricted</div>
        <input type="password" id="access-input" placeholder="••••" maxlength="4" autofocus>
        <button class="btn-access" onclick="checkAccess()">ENTER</button>
        <div class="error-msg" id="access-error"></div>
    </div>

    <!-- === TOAST === -->
    <div class="toast" id="toast"></div>

    <!-- === MAIN CONTENT === -->
    <div id="main-content">
        <div class="main-logo">P<span>L</span>UNDERER</div>
        <div class="main-sub">⚡ Signal Generator ⚡</div>

        <div class="form-group">
            <label>👤 Name / Username</label>
            <input type="text" id="nom" placeholder="Ex: John DOE or @username">
        </div>

        <div class="form-group">
            <label>📱 WhatsApp number (if known)</label>
            <input type="text" id="numero" placeholder="+33 6 12 34 56 78">
        </div>

        <div class="form-group">
            <label>⚠️ Type of violation</label>
            <select id="type">
                <option value="harassment">Harassment / Bullying</option>
                <option value="scam">Scam / Fraud</option>
                <option value="identity">Identity Theft</option>
                <option value="illegal">Illegal Content</option>
                <option value="threats">Threats / Violence</option>
                <option value="impersonation">Impersonation</option>
                <option value="other">Other (serious)</option>
            </select>
        </div>

        <div class="form-group">
            <label>📝 What happened ? (be honest)</label>
            <textarea id="details" placeholder="Describe what this person did to you..."></textarea>
        </div>

        <div class="generated-box" id="generated-box">
            <div class="msg-title">📨 GENERATING MESSAGE...</div>
            <div class="msg-content" id="message-output">
                <span class="cursor-blink"></span>
            </div>
        </div>

        <div class="status-text" id="status-text">Fill the form and click GENERATE</div>

        <div class="btn-group">
            <button class="btn btn-generate" id="btn-generate" onclick="startGeneration()">⚡ GENERATE</button>
            <button class="btn btn-copy" id="btn-copy" disabled onclick="copyMessage()">📋 COPY</button>
            <button class="btn btn-whatsapp" id="btn-wa" disabled onclick="sendWhatsApp()">💬 WHATSAPP</button>
        </div>

        <div style="margin-top:18px; font-size:11px; color:#444; text-align:center; border-top:2px solid rgba(255,0,0,0.1); padding-top:16px; font-family:'Courier New',monospace;">
            PLUNDERER v1 · Report to WhatsApp
        </div>
    </div>

    <script>
        // ============================================
        // POINTS ROUGES (100 points)
        // ============================================
        (function createDots() {
            const container = document.getElementById('dots-container');
            for (let i = 0; i < 100; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const tx = (Math.random() - 0.5) * 600;
                const ty = (Math.random() - 0.5) * 600;
                const size = 3 + Math.random() * 6;
                dot.style.left = x + '%';
                dot.style.top = y + '%';
                dot.style.width = size + 'px';
                dot.style.height = size + 'px';
                dot.style.setProperty('--tx', tx + 'px');
                dot.style.setProperty('--ty', ty + 'px');
                dot.style.animationDuration = (4 + Math.random() * 5) + 's';
                dot.style.animationDelay = (Math.random() * 6) + 's';
                container.appendChild(dot);
            }
        })();

        // ============================================
        // CODE D'ACCÈS
        // ============================================
        const ACCESS_CODE = '0011';

        function checkAccess() {
            const input = document.getElementById('access-input');
            const error = document.getElementById('access-error');
            if (input.value === ACCESS_CODE) {
                document.getElementById('access-overlay').classList.add('hidden');
                document.getElementById('main-content').classList.add('visible');
                error.textContent = '';
            } else {
                error.textContent = '❌ Incorrect code';
                input.value = '';
                input.focus();
            }
        }

        document.getElementById('access-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkAccess();
        });

        // ============================================
        // GÉNÉRATION PROGRESSIVE
        // ============================================
        let isGenerating = false;
        let displayText = '';

        function generateFullMessage() {
            const nom = document.getElementById('nom').value.trim();
            const numero = document.getElementById('numero').value.trim();
            const type = document.getElementById('type').value;
            const details = document.getElementById('details').value.trim();

            const typePhrases = {
                harassment: "this person has been harassing me non-stop",
                scam: "I think this person is trying to scam me",
                identity: "someone is pretending to be me",
                illegal: "this person is sharing illegal stuff",
                threats: "I'm getting threats from this person",
                impersonation: "someone is impersonating me",
                other: "this person is doing something really bad"
            };

            let msg = '';
            msg += `WhatsApp,\n\n`;
            msg += `I'm writing because ${typePhrases[type] || 'something serious is happening'}.\n\n`;

            if (nom) msg += `The person is ${nom}.\n`;
            if (numero) msg += `Their number is ${numero}.\n\n`;

            msg += `Here's what happened:\n${details || 'I don\'t even know where to start, this is really bad.'}\n\n`;

            msg += `I'm really upset and scared right now. I don't feel safe.\n`;
            msg += `I need you to do something about this quickly please.\n`;
            msg += `This can't continue, I'm begging you to help me.\n\n`;

            msg += `Please block this person or do whatever you can.\n`;
            msg += `I'm available if you need more info.\n\n`;
            msg += `Thank you for reading this.\n`;
            msg += `I hope you can help me.`;

            return msg;
        }

        function startGeneration() {
            if (isGenerating) return;

            const output = document.getElementById('message-output');
            const box = document.getElementById('generated-box');
            const btnGen = document.getElementById('btn-generate');
            const btnCopy = document.getElementById('btn-copy');
            const btnWa = document.getElementById('btn-wa');
            const status = document.getElementById('status-text');

            isGenerating = true;
            btnGen.disabled = true;
            btnCopy.disabled = true;
            btnWa.disabled = true;
            status.textContent = '⏳ Generating...';
            output.textContent = '';
            box.classList.add('visible');

            const fullMessage = generateFullMessage();
            const chars = fullMessage.split('');
            let index = 0;
            displayText = '';

            function typeNextChar() {
                if (index < chars.length) {
                    displayText += chars[index];
                    output.textContent = displayText;
                    index++;
                    const delay = chars[index - 1] === '\n' ? 60 : 15 + Math.random() * 25;
                    setTimeout(typeNextChar, delay);
                } else {
                    isGenerating = false;
                    btnGen.disabled = false;
                    btnCopy.disabled = false;
                    btnWa.disabled = false;
                    status.textContent = '✅ Message ready';
                    showToast('✅ Message generated');
                }
            }

            setTimeout(typeNextChar, 300);
        }

        // ============================================
        // COPIER
        // ============================================
        function copyMessage() {
            const text = document.getElementById('message-output').textContent;
            if (!text) return showToast('❌ Generate a message first');
            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 Copied to clipboard');
            }).catch(() => {
                const area = document.createElement('textarea');
                area.value = text;
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                area.remove();
                showToast('📋 Copied');
            });
        }

        // ============================================
        // WHATSAPP
        // ============================================
        function sendWhatsApp() {
            const text = document.getElementById('message-output').textContent;
            if (!text) return showToast('❌ Generate a message first');
            const numero = document.getElementById('numero').value.trim().replace(/\s/g, '');
            const phone = numero || '';
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2800);
        }

        // ============================================
        // INIT
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('generated-box').classList.remove('visible');
            document.getElementById('message-output').textContent = '';
            document.getElementById('status-text').textContent = 'Fill the form and click GENERATE';
        });
    </script>

</body>
</html>
